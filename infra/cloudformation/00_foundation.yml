AWSTemplateFormatVersion: "2010-09-09"
Description: "Foundation resources for Financial Sentiment Radar: S3 data lake and ECR repository."

Parameters:
  ProjectName:
    Type: String
    Default: financial-sentiment-radar
  Environment:
    Type: String
    Default: dev
  DataBucketName:
    Type: String
    Default: ""
    Description: "Optional globally unique bucket name. Leave empty to let CloudFormation generate one."

Conditions:
  UseGeneratedBucketName: !Equals [!Ref DataBucketName, ""]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [UseGeneratedBucketName, !Ref AWS::NoValue, !Ref DataBucketName]
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawTweetsAfter180Days
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 180
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            Prefix: ""
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${DataBucket}"
              - !Sub "arn:aws:s3:::${DataBucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-${Environment}"
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only last 5 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["app"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Expire untagged images after 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

Outputs:
  DataBucketName:
    Description: "S3 bucket for raw, processed and output data."
    Value: !Ref DataBucket
    Export:
      Name: !Sub "${AWS::StackName}-DataBucketName"
  EcrRepositoryUri:
    Description: "ECR repository URI for the Streamlit image."
    Value: !GetAtt EcrRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-EcrRepositoryUri"
  EcrRepositoryName:
    Description: "ECR repository name."
    Value: !Ref EcrRepository
